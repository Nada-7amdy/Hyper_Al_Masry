<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>هايبر المصري الفاخر</title>
    <script>
      // Single Page Apps for GitHub Pages redirect
      // Converts deep links (e.g. /admin) to hash-based navigation (#/admin)
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      if (path.indexOf('/admin') !== -1) {
        window.location.replace('/#/admin' + search);
      } else {
        window.location.replace('/' + (hash || ''));
      }
    </script>
  </head>
  <body style="background-color: #0A0B0D; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #10B981;">هايبر المصري الفاخر</h2>
      <p style="color: #888;">جاري تحويلك للصفحة المطلوبة...</p>
    </div>
  </body>
</html>
